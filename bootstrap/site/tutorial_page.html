<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | dot-files</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Marian Posăceanu">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{canonical}}">
  <script type="application/ld+json">{{schema}}</script>
  <link rel="preload" href="fonts/lora-v24-latin-ext_latin-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Fira_Sans_500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="assets/site.css?v={{css-hash}}">
  <link rel="stylesheet" href="assets/dotfiles.css?v={{dotfiles-hash}}">
  <script src="assets/site.js?v={{js-hash}}" defer></script>
</head>
<body class="site-article" id="top">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="main-navigation" aria-label="Main navigation">
      <a class="nav-home" href="/">dot-files</a>
      <a href="https://marianposaceanu.com/">marianposaceanu.com</a>
    </nav>
  </header>

  <main class="page" id="main-content">
    <header class="hero" aria-labelledby="page-title">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 id="page-title">{{title}}</h1>
      <p class="subtitle">{{description}}</p>
      <ul class="meta" aria-label="Article metadata">
        <li>{{category}}</li>
        <li><time class="article-date" datetime="{{published}}">{{visible-date}}</time></li>
        <li>By <a href="https://marianposaceanu.com/home/about">Marian Posăceanu</a></li>
      </ul>
    </header>

    <nav class="toc" aria-label="Table of contents">
      <h2>On this page</h2>
      <ol>
{{toc}}
      </ol>
    </nav>

    <article class="article article-flow">
{{body}}
    </article>
  </main>

  <footer class="page-footer">
    <p><a class="home-link" href="/">Back to dot-files</a></p>
    <p><a href="https://github.com/marianposaceanu/dot-files">Browse the configuration source</a></p>
  </footer>
</body>
</html>
